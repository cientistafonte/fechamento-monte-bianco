<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Bianco — Fechamento de Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* Paleta oficial (Manual da marca · 04 Cores) */
  :root{
    --mb-azul:#03305A;   /* Azul Monte Bianco */
    --mb-base:#1D5A90;   /* Azul Base */
    --mb-preto:#000000;
    --mb-branco:#FFFFFF;
    /* apenas sinalização de mercado */
    --alta:#3FBF8F; --baixa:#F2705D;
    /* tons derivados do branco sobre os azuis */
    --txt-2:rgba(255,255,255,0.72);
    --txt-3:rgba(255,255,255,0.50);
    --linha:rgba(255,255,255,0.14);
    /* fundo do gráfico: dois tons escuros derivados do Azul Monte Bianco */
    --grafico-1:#000000;   /* topo */
    --grafico-2:#021A30;   /* base (Azul Monte Bianco escurecido) */
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Source Sans 3',sans-serif; background:#eef1f5; color:#0d1b2a; display:flex; min-height:100vh;}
  .workspace{display:flex; width:100%; flex-wrap:wrap;}

  /* ---------- Painel ---------- */
  .panel{width:440px; max-width:100%; background:#fbfcfd; padding:28px 26px 60px; border-right:1px solid #d8e0e8; overflow-y:auto; max-height:100vh;}
  .panel h1{font-size:23px; margin:0 0 4px; color:var(--mb-azul); font-weight:700;}
  .panel .sub{font-size:14px; color:#5b6b7c; margin:0 0 22px; line-height:1.5;}
  label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:#6b7a89; font-weight:600; margin:16px 0 6px;}
  input[type=text], textarea{width:100%; padding:9px 11px; border:1px solid #cdd8e2; border-radius:6px; font-family:'Source Sans 3',sans-serif; font-size:14.5px; background:#fff;}
  .hint{font-size:12.5px; color:#7c8a98; margin-top:8px; line-height:1.5;}
  .group-label{margin-top:26px; font-size:16px; font-weight:700; color:var(--mb-azul); border-bottom:1px solid #dde5ed; padding-bottom:6px;}
  .asset-row{display:grid; grid-template-columns:1fr 90px 90px 26px; gap:6px; align-items:center; margin-top:8px;}
  .asset-row input{padding:7px 8px; font-size:13.5px;}
  .remove-btn{background:none; border:none; color:#c0503f; font-size:15px; cursor:pointer;}
  .add-btn{width:100%; padding:9px; border:1.5px dashed #bcc9d6; background:none; border-radius:8px; color:#5b6b7c; font:600 13.5px 'Source Sans 3',sans-serif; cursor:pointer; margin-top:8px;}
  .add-btn:hover{border-color:var(--mb-base); color:var(--mb-base);}
  .export-btn{width:100%; margin-top:26px; padding:15px; background:var(--mb-azul); color:#fff; font:700 15.5px 'Source Sans 3',sans-serif; border:none; border-radius:8px; cursor:pointer;}
  .export-btn:hover{background:var(--mb-base);}

  /* ---------- Palco ---------- */
  .stage{flex:1; display:flex; align-items:flex-start; justify-content:center; padding:40px 24px; background:#eef1f5; min-width:340px;}
  .stage-inner{position:sticky; top:40px;}
  #card{width:1080px; height:1920px; transform:scale(0.30); transform-origin:top left; margin-bottom:-1344px; margin-right:-756px;}
  @media (max-width:900px){ #card{transform:scale(0.22); margin-bottom:-1498px; margin-right:-842px;} }

  /* ---------- Story 1080x1920 ---------- */
  .card-bg{width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff;
    font-family:'Source Sans 3',sans-serif; display:flex; flex-direction:column;
    background:linear-gradient(180deg, var(--mb-azul) 0%, var(--mb-base) 100%);}   /* degradê do logo */
  .peaks{position:absolute; bottom:0; left:0; width:1080px; height:420px; opacity:.05;}
  .card-bg > *:not(.peaks){position:relative; z-index:2;}
  .num{font-variant-numeric:tabular-nums;}
  .up{color:var(--alta);} .down{color:var(--baixa);}

  /* topo escuro com o gráfico (preto → azul Monte Bianco) */
  .hero{padding:70px 72px 36px; border-radius:0 0 40px 40px;
    background:linear-gradient(180deg, var(--grafico-1) 0%, var(--grafico-2) 100%);
    box-shadow:0 20px 50px rgba(0,0,0,0.35);}
  .hero .top{display:flex; justify-content:space-between; align-items:center;}
  .hero .tag{font-size:27px; letter-spacing:.2em; text-transform:uppercase; font-weight:700; color:var(--txt-2);}
  .hero .date{font-size:28px; font-weight:600; color:var(--txt-2);}
  .hero .titulo{font-size:62px; font-weight:700; margin:40px 0 0; letter-spacing:-0.01em; line-height:1;}
  .hero .titulo span{font-weight:400; color:var(--txt-2);}
  .hero .big{display:flex; align-items:flex-end; justify-content:space-between; margin-top:24px;}
  .hero .val{font-size:132px; font-weight:800; line-height:.9; letter-spacing:-0.02em;}
  .hero .val small{font-size:54px; font-weight:600; color:var(--txt-2); margin-right:12px; letter-spacing:0;}
  .hero .chg{text-align:right;}
  .hero .chg .d{font-size:52px; font-weight:700;}
  .hero .chg .per{font-size:26px; color:var(--txt-2); margin-top:4px;}
  .hero .sub{font-size:26px; color:var(--txt-3); margin-top:14px;}
  .hero svg{display:block; width:100%; margin-top:22px;}
  .hero .foot{display:flex; justify-content:space-between; font-size:24px; color:var(--txt-3); margin-top:8px;}

  /* cotações em barras */
  .bars-wrap{margin:50px 72px 0; flex:1; display:flex; flex-direction:column; min-height:0;}
  .bars-head{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.30); margin-bottom:4px;}
  .bars-head .t{font-size:28px; letter-spacing:.18em; text-transform:uppercase; color:var(--txt-2); font-weight:700;}
  .bars-head .s{font-size:25px; color:var(--txt-2); font-weight:600;}
  .bars{flex:1; display:flex; flex-direction:column; min-height:0;}
  .bar-row{flex:1 1 0; min-height:0; display:flex; align-items:center; gap:16px;}
  .bar-name{width:365px; flex:none; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1; position:relative; height:100%; display:flex; align-items:center;}
  .bar-zero{position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.30);}
  .bar-fill{position:absolute; border-radius:5px;}
  .bar-fill.up{background:var(--alta);} .bar-fill.down{background:var(--baixa);}
  .bar-pct{position:absolute; font-weight:600; white-space:nowrap;}
  .bar-val{width:200px; flex:none; text-align:right; color:var(--txt-2);}

  /* assinatura */
  .footer{padding:44px 72px 72px;}
  .rule{height:1px; width:100%; background:rgba(255,255,255,0.28); margin-bottom:36px;}
  .sig{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .sig img.logo{height:66px; width:auto; object-fit:contain;}
