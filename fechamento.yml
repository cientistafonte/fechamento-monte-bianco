name: Gerar Fechamento de Mercado

on:
  schedule:
    # 21:30 UTC = 18:30 no horário de Brasília (após o fim do pregão).
    # Roda de segunda (1) a sexta (5).
    # Ajuste o horário mudando os dois primeiros números (minuto hora).
    - cron: "30 21 * * 1-5"
  # Permite rodar manualmente pelo botão "Run workflow" na aba Actions.
  workflow_dispatch:

# Permite que o workflow faça commit da imagem gerada de volta no repositório.
permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install yfinance playwright
          playwright install --with-deps chromium

      - name: Gerar a imagem de fechamento
        run: python gerar_fechamento.py

      - name: Publicar a imagem no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add saida/*.png
          git commit -m "Fechamento de mercado $(date +'%Y-%m-%d')" || echo "Nada novo para commitar"
          git push

      # (Opcional) também disponibiliza a imagem como artefato para download
      - name: Salvar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: fechamento-do-dia
          path: saida/fechamento-mais-recente.png
          retention-days: 14
