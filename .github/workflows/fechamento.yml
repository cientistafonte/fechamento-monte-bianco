name: Gerar Fechamento de Mercado

on:
  schedule:
    # 20:30 UTC = 17:30 no horário de Brasília.
    # Perto do fechamento da B3 (18h), com folga para o agendador do
    # GitHub, que pode atrasar 1-2h em horários de pico.
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install yfinance playwright
          playwright install --with-deps chromium

      - name: Gerar a imagem de fechamento
        run: python gerar_fechamento.py

      - name: Publicar a imagem no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add saida/*.png
          git commit -m "Fechamento de mercado" || echo "Nada novo para commitar"
          git push

      - name: Enviar por e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USUARIO }}
          password: ${{ secrets.EMAIL_SENHA }}
          from: Monte Bianco MFO <${{ secrets.EMAIL_USUARIO }}>
          to: ${{ secrets.EMAIL_DESTINO }}
          subject: Fechamento de Mercado do dia
          body: |
            Segue em anexo a imagem do fechamento de mercado gerada automaticamente.

            Monte Bianco MFO
          attachments: saida/fechamento-mais-recente.png

      - name: Enviar no Telegram
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F photo="@saida/fechamento-mais-recente.png" \
            -F caption="Fechamento de Mercado do dia - Monte Bianco MFO"

      - name: Salvar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: fechamento-do-dia
          path: saida/fechamento-mais-recente.png
          retention-days: 14
